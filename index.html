<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TS HEALTHCARES— Login | Hospital Appointment System</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>

<iframe
    width="100"
    height="212"
    src="https://www.youtube.com/embed/c6tJrEu_J-U"
    title="⚕️ About Us"
    frameborder="0"
    allow="acceleromete;contro;
 clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
</iframe>


  <!-- Animated background blobs -->
  <div class="bg-blobs">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <!-- Glass Card -->
  <main class="glass-card">
    <!-- Brand -->
    <header class="brand">
      <div class="brand-logo">🏥</div>
      <h1 class="brand-title">TS HEALTHCARES </h1>
      <p class="brand-subtitle">Hospital Appointment System</p>
    </header>

    <!-- Role Tabs (only for Login) -->
    <div class="role-tabs" id="roleTabs" role="tablist">
      <button class="role-tab active" data-role="patient">Patient</button>
      <button class="role-tab" data-role="doctor">Doctor</button>
      <button class="role-tab" data-role="admin">Admin</button>
      <span class="role-indicator"></span>
    </div>

    <!-- Login / Register Toggle -->
    <div class="auth-toggle">
      <button class="auth-btn active" data-mode="login">Login</button>
      <button class="auth-btn" data-mode="register">Register</button>
    </div>

    <!-- Register Info Note -->
    <div class="register-note hidden" id="registerNote">
      <span class="note-icon">ℹ️</span>
      <span class="note-text">
        Registration is only for <strong>Patients</strong>. Doctors and Admins
        are added by the hospital.
      </span>
    </div>

    <!-- Form -->
    <form id="authForm" class="auth-form" autocomplete="off">
      <!-- Name (only for register) -->
      <div class="input-group hidden" id="nameGroup">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" />
      </div>

      <!-- Email -->
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>

      <!-- Password -->
      <div class="input-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="••••••••"
          required
          minlength="6"
        />
      </div>

      <!-- Confirm Password (only for register) -->
      <div class="input-group hidden" id="confirmGroup">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="••••••••"
          minlength="6"
        />
      </div>

      <!-- Forgot Password (only for login) -->
      <div class="form-meta" id="forgotWrap">
        <a href="reset-password.html" class="link">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="btn-text">Login as Patient</span>
      </button>

      <!-- Message -->
      <p class="form-message" id="formMessage"></p>
    </form>
  </main>

  <script src="auth.js"></script>
</body>
</html>
