<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — MediCare</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-blobs">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <main class="glass-card">
    <header class="brand">
      <div class="brand-logo">🔐</div>
      <h1 class="brand-title">Reset Password</h1>
      <p class="brand-subtitle">Recover your MediCare account</p>
    </header>

    <!-- Step Indicator -->
    <div class="step-indicator">
      <div class="step active" data-step="1">
        <span class="step-num">1</span>
        <span class="step-label">Verify</span>
      </div>
      <div class="step-line"></div>
      <div class="step" data-step="2">
        <span class="step-num">2</span>
        <span class="step-label">Reset</span>
      </div>
      <div class="step-line"></div>
      <div class="step" data-step="3">
        <span class="step-num">3</span>
        <span class="step-label">Done</span>
      </div>
    </div>

    <!-- Step 1: Email + Role -->
    <form class="auth-form step-content" data-step="1">
      <p class="step-info">Enter your registered email and select your role.</p>

      <div class="input-group">
        <label>I am a</label>
        <div class="role-pills" id="rolePills">
          <button type="button" class="role-pill active" data-role="patient">Patient</button>
          <button type="button" class="role-pill" data-role="doctor">Doctor</button>
          <button type="button" class="role-pill" data-role="admin">Admin</button>
        </div>
      </div>

      <div class="input-group">
        <label for="resetEmail">Email</label>
        <input type="email" id="resetEmail" placeholder="you@example.com" required />
      </div>

      <button type="submit" class="submit-btn">
        <span class="btn-text">Send OTP</span>
      </button>
      <p class="form-message" id="msg1"></p>
    </form>

    <!-- Step 2: OTP + New Password -->
    <form class="auth-form step-content hidden" data-step="2">
      <p class="step-info">We've sent a 6-digit OTP to <strong id="otpEmail"></strong>. Enter it below with your new password.</p>

      <div class="input-group">
        <label for="otp">OTP Code</label>
        <input type="text" id="otp" placeholder="123456" maxlength="6" inputmode="numeric" />
        <small class="otp-hint">Demo OTP: <strong>123456</strong></small>
      </div>

      <div class="input-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="••••••••" minlength="6" />
      </div>

      <div class="input-group">
        <label for="confirmNewPassword">Confirm New Password</label>
        <input type="password" id="confirmNewPassword" placeholder="••••••••" minlength="6" />
      </div>

      <button type="submit" class="submit-btn">
        <span class="btn-text">Reset Password</span>
      </button>
      <p class="form-message" id="msg2"></p>
    </form>

    <!-- Step 3: Success -->
    <div class="auth-form step-content hidden" data-step="3">
      <div class="success-icon">✅</div>
      <p class="step-info" style="text-align:center;">
        Your password has been reset successfully!
      </p>
      <a href="index.html" class="submit-btn" style="text-decoration:none; text-align:center;">
        <span class="btn-text">Back to Login</span>
      </a>
    </div>

    <p class="back-link-wrap">
      <a href="index.html" class="link">← Back to Login</a>
    </p>
  </main>

  <script src="reset-password.js"></script>
</body>
</html>
